<!-- admin.html -->
<!-- COMPANY / SECRETARY DASHBOARD -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SaMaPa Admin Dashboard</title>

  <link rel="stylesheet" href="samapa.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

  <div class="logo-section">

    <img src="assets/logo.png">

    <div>
      <h2>SaMaPa Admin</h2>
      <p>Secretary Monitoring Dashboard</p>
    </div>

  </div>

</header>

<!-- ================= ADMIN LOGIN ================= -->

<section class="admin-login">

  <div class="admin-box">

    <h2>Secretary Login</h2>

    <form id="adminLoginForm">

      <input type="text" placeholder="Admin Username" required>

      <input type="password" placeholder="Admin Password" required>

      <button class="submit-btn">
        Login as Admin
      </button>

    </form>

  </div>

</section>

<!-- ================= DASHBOARD ================= -->

<section class="monitoring hidden" id="dashboard">

  <div class="section-title">

    <h2>Fishpond Monitoring Dashboard</h2>

    <p>
      Private monitoring dashboard for SaMaPa administrators only.
    </p>

  </div>

  <div class="table-container">

    <table>

      <thead>

        <tr>
          <th>Owner Name</th>
          <th>Address</th>
          <th>Fishpond Location</th>
          <th>Square Meter</th>
        </tr>

      </thead>

      <tbody id="adminTable">

        <tr>
          <td>Juan Dela Cruz</td>
          <td>Pangasinan</td>
          <td>Lingayen</td>
          <td>2500 sqm</td>
        </tr>

        <tr>
          <td>Maria Santos</td>
          <td>Dagupan</td>
          <td>Binmaley</td>
          <td>4200 sqm</td>
        </tr>

      </tbody>

    </table>

  </div>

</section>

<script>

const adminForm = document.getElementById("adminLoginForm");

adminForm.addEventListener("submit", function(e){

  e.preventDefault();

  document.querySelector(".admin-login").style.display = "none";

  document.getElementById("dashboard").classList.remove("hidden");

  loadUsers();

});

// ================= LOAD USERS =================

function loadUsers(){

  const users = JSON.parse(localStorage.getItem("fishpondUsers")) || [];

  const table = document.getElementById("adminTable");

  table.innerHTML = "";

  users.forEach(user => {

    const row = `
      <tr>
        <td>${user.fullname}</td>
        <td>${user.address}</td>
        <td>${user.fishpond}</td>
        <td>${user.sqm}</td>
      </tr>
    `;

    table.innerHTML += row;

  });

}

</script>

</body>
</html>
